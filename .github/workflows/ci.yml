name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Dependency security audit
        run: pip-audit -r requirements.txt
      - name: Import smoke test
        run: python -c "import aiogram; from app.handlers import build_router; from app.main import run; print('aiogram', aiogram.__version__)"
      - name: Compile source
        run: python -m compileall -q app tests
      - name: Tests
        run: pytest -q
