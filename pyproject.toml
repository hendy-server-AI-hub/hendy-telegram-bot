[project]
name = "hendy-telegram-bot"
version = "1.0.0"
description = "Production-oriented Telegram control bot for Hendy GitHub, Render, AI, server health, and security operations."
requires-python = ">=3.11,<3.15"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 is excluded because the command help text, URLs and API error messages
# contain intentionally long literals. All other selected rules remain enforced.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
